<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | BANGLAPUNK</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Fonts -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: white;
            -webkit-font-smoothing: antialiased;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* --- Styling System (Reused from Contact/Receipt) --- */
        :root {
            --card-bg: #161616;
            --input-bg: #0a0a0a;
            --border-color: #262626;
        }

        * { -webkit-tap-highlight-color: transparent; }

        .checkout-card {
            background-color: var(--card-bg);
            border-radius: 1rem;
        }

        .input-inset {
            background-color: var(--input-bg); 
            border: 1px solid var(--border-color);
            transition: border-color 0.2s;
        }
        .input-inset:focus {
            border-color: #555;
            outline: none;
        }

        /* Custom Radio Button Styling */
        .payment-radio:checked + div {
            background-color: white;
            color: black;
            border-color: white;
        }
        
    </style>
</head>
<body class="bg-[#050505] selection:bg-red-900 selection:text-white">

    <div id="app" class="max-w-md mx-auto relative min-h-screen pb-10 bg-[#050505] shadow-2xl shadow-black flex flex-col">

        <!-- Navbar -->
        <nav class="fixed top-0 left-0 right-0 z-40 flex items-center justify-between px-4 py-4 bg-gradient-to-b from-black/90 to-transparent max-w-md mx-auto w-full pointer-events-none">
            <button class="text-white hover:text-gray-300 pointer-events-auto" onclick="history.back()">
                <i data-lucide="chevron-left" class="w-6 h-6"></i>
            </button>
            <div class="font-extrabold text-xl tracking-tighter text-white">CHECKOUT</div>
            <div class="w-6"></div> 
        </nav>

        <main class="pt-24 px-4 flex-1 flex flex-col">
            
            <h1 class="text-3xl font-black uppercase mb-6 font-sans tracking-tight text-white">Delivery Info</h1>

            <form id="checkout-form" onsubmit="handleCheckout(event)" class="space-y-6">
                
                <!-- Required Info -->
                <div class="checkout-card p-5 space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1 uppercase">Receiver Name <span class="text-red-500">*</span></label>
                        <input type="text" id="field-name" class="input-inset w-full rounded-lg p-3 text-white placeholder-gray-700" placeholder="Full Name" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1 uppercase">Phone Number <span class="text-red-500">*</span></label>
                        <input type="tel" id="field-phone" class="input-inset w-full rounded-lg p-3 text-white placeholder-gray-700" placeholder="017..." required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1 uppercase">Address <span class="text-red-500">*</span></label>
                        <textarea id="field-address" rows="3" class="input-inset w-full rounded-lg p-3 text-white placeholder-gray-700 resize-none" placeholder="House, Road, Area..." required></textarea>
                    </div>
                </div>

                <!-- Optional Info -->
                <div class="checkout-card p-5 space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1 uppercase">Delivery Notes <span class="text-[10px] bg-gray-800 px-1 rounded ml-1 text-gray-400 normal-case">Optional</span></label>
                        <input type="text" id="field-notes" class="input-inset w-full rounded-lg p-3 text-white placeholder-gray-700" placeholder="Leave at guard post...">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1 uppercase">Preferred Timeframe <span class="text-[10px] bg-gray-800 px-1 rounded ml-1 text-gray-400 normal-case">Optional</span></label>
                        <select id="field-time" class="input-inset w-full rounded-lg p-3 text-white appearance-none cursor-pointer">
                            <option value="" disabled selected>Select Time of Day</option>
                            <option value="morning">Morning (10AM - 1PM)</option>
                            <option value="afternoon">Afternoon (2PM - 6PM)</option>
                            <option value="evening">Evening (6PM - 9PM)</option>
                        </select>
                    </div>
                </div>

                <!-- Payment Method -->
                <div>
                    <h2 class="text-xl font-bold uppercase mb-3 text-white">Payment Method</h2>
                    <div class="flex gap-3">
                        <!-- COD Option -->
                        <label class="flex-1 cursor-pointer group">
                            <input type="radio" name="payment" value="cod" class="payment-radio hidden" checked>
                            <div class="input-inset border border-gray-700 rounded-xl p-4 flex flex-col items-center justify-center h-24 transition-all group-hover:border-gray-500">
                                <span class="font-black text-lg">COD</span>
                                <span class="text-[10px] uppercase tracking-wide mt-1 opacity-70">Cash on Delivery</span>
                            </div>
                        </label>
                        
                        <!-- bKash Option -->
                        <label class="flex-1 cursor-pointer group">
                            <input type="radio" name="payment" value="bkash" class="payment-radio hidden">
                            <div class="input-inset border border-gray-700 rounded-xl p-4 flex flex-col items-center justify-center h-24 transition-all group-hover:border-gray-500">
                                <span class="font-black text-lg text-pink-500">bKash</span>
                                <span class="text-[10px] uppercase tracking-wide mt-1 opacity-70">Send Money</span>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submit-btn" class="w-full bg-white text-black font-black text-lg py-4 rounded-xl hover:bg-gray-200 transition-all uppercase tracking-wide mt-4 active:scale-[0.98] shadow-[0_0_20px_rgba(255,255,255,0.1)]">
                    Proceed to Pay
                </button>

            </form>
        </main>
    </div>

    <!-- Logic -->
    <script>
        lucide.createIcons();

        // --- Lifecycle Tracking (Mock) ---
        window.addEventListener('load', () => {
            console.log("[TRACKING] Unique Visitor created in 'visits' collection.");
            // Generate mock Order ID immediately for internal tracking
            sessionStorage.setItem('temp_order_id', 'BP-' + Math.floor(Math.random() * 10000) + '-XM');
        });

        // --- Checkout Logic ---
        async function handleCheckout(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const paymentMethod = document.querySelector('input[name="payment"]:checked').value;
            const orderId = sessionStorage.getItem('temp_order_id') || 'BP-NEW-ORDER';

            // Loading State
            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin mx-auto"></i>`;
            lucide.createIcons();
            btn.classList.add('opacity-70', 'cursor-not-allowed');

            // Mock Backend Payload
            const payload = {
                orderId: orderId,
                customer: {
                    name: document.getElementById('field-name').value,
                    phone: document.getElementById('field-phone').value,
                    address: document.getElementById('field-address').value
                },
                payment: paymentMethod,
                timestamp: new Date().toISOString()
            };

            console.log("[BACKEND] Creating Order...", payload);
            console.log("[TRACKING] User added to 'Customers' collection.");

            // Mock Network Delay
            await new Promise(r => setTimeout(r, 2000));

            // Redirect Logic
            if (paymentMethod === 'cod') {
                // Redirect to Receipt with Confirmed Status
                // In real app: /invoice/{orderId}
                // Here we simulate by passing query param
                window.location.href = `receipt.html?status=confirmed&id=${orderId}`;
            } else {
                // Redirect to Receipt with Pending Status (to show bKash guide)
                window.location.href = `receipt.html?status=pending&id=${orderId}`;
            }
        }
    </script>
</body>
</html>
