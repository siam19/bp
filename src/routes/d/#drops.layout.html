<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drops Archive | BANGLAPUNK</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Fonts -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: white;
            -webkit-font-smoothing: antialiased;
        }

        .font-mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="bg-[#050505] selection:bg-red-900 selection:text-white">

    <div id="app" class="max-w-md mx-auto relative min-h-screen pb-10 bg-[#050505] shadow-2xl shadow-black flex flex-col">

        <!-- Component: Navbar (Placeholder) -->
        <!-- Use the shared <Navbar /> component here -->
        <div class="h-20"></div> 

        <main class="px-4 flex-1">
            
            <h1 class="text-4xl font-black uppercase mb-2 font-sans tracking-tight text-white">Archive</h1>
            <p class="text-xs text-gray-500 mb-8 font-mono">Index of all temporal artifacts.</p>

            <div class="space-y-6">

                <!-- 1. Live Drop Card -->
                <div class="relative w-full aspect-[16/9] bg-gray-900 rounded-xl overflow-hidden group cursor-pointer border border-red-900/50">
                    <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=800&auto=format&fit=crop" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105 opacity-80">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent"></div>
                    
                    <!-- Status Badge -->
                    <div class="absolute top-3 right-3 bg-red-600 text-white text-[10px] font-bold px-2 py-1 rounded-full animate-pulse">
                        LIVE NOW
                    </div>

                    <div class="absolute bottom-4 left-4">
                        <!-- Removed stylized font, using standard bold sans -->
                        <h3 class="text-3xl font-black text-white uppercase leading-none mb-1">Panter</h3>
                        <p class="text-xs text-gray-300 font-mono">Ends in 13 Days</p>
                    </div>
                </div>

                <!-- 2. Upcoming Drop Card -->
                <div class="relative w-full aspect-[16/9] bg-gray-900 rounded-xl overflow-hidden group cursor-pointer border border-gray-800">
                    <img src="https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=800&auto=format&fit=crop" class="w-full h-full object-cover grayscale transition-all duration-700 group-hover:grayscale-0 group-hover:scale-105 opacity-60">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-transparent to-transparent"></div>
                    
                    <div class="absolute top-3 right-3 bg-gray-800 text-gray-300 text-[10px] font-bold px-2 py-1 rounded-full border border-gray-700">
                        UPCOMING
                    </div>

                    <div class="absolute bottom-4 left-4">
                        <h3 class="text-3xl font-black text-white uppercase leading-none mb-1">Glitch_Protocol</h3>
                        <p class="text-xs text-gray-400 font-mono">12 / 05 / 2025</p>
                    </div>
                </div>

                <!-- 3. Archived Drop -->
                <div class="relative w-full aspect-[16/9] bg-gray-900 rounded-xl overflow-hidden group cursor-pointer border border-gray-800 opacity-70 hover:opacity-100 transition-opacity">
                    <img src="https://images.unsplash.com/photo-1605218427306-635ba2439af2?q=80&w=800&auto=format&fit=crop" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-black/60 group-hover:bg-black/40 transition-colors"></div>
                    
                    <div class="absolute top-3 right-3 text-gray-500 text-[10px] font-bold px-2 py-1 border border-gray-700 rounded-full">
                        ARCHIVED
                    </div>

                    <div class="absolute bottom-4 left-4">
                        <h3 class="text-2xl font-black text-gray-300 uppercase leading-none mb-1">FlowerChild</h3>
                        <!-- Changed status text -->
                        <p class="text-[10px] text-gray-500 font-mono">Ended 10 / 10 / 2024</p>
                    </div>
                </div>

                <!-- 4. Archived Drop -->
                <div class="relative w-full aspect-[16/9] bg-gray-900 rounded-xl overflow-hidden group cursor-pointer border border-gray-800 opacity-70 hover:opacity-100 transition-opacity">
                    <img src="https://images.unsplash.com/photo-1469334031218-e382a71b716b?q=80&w=800&auto=format&fit=crop" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-black/60 group-hover:bg-black/40 transition-colors"></div>
                    
                    <div class="absolute top-3 right-3 text-gray-500 text-[10px] font-bold px-2 py-1 border border-gray-700 rounded-full">
                        ARCHIVED
                    </div>

                    <div class="absolute bottom-4 left-4">
                        <h3 class="text-2xl font-black text-gray-300 uppercase leading-none mb-1">Kaban</h3>
                        <!-- Changed status text -->
                        <p class="text-[10px] text-gray-500 font-mono">Ended 05 / 08 / 2024</p>
                    </div>
                </div>

            </div>
        </main>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
