<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Products | BANGLAPUNK</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Fonts -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: white;
            -webkit-font-smoothing: antialiased;
        }

        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#050505] selection:bg-red-900 selection:text-white">

    <div id="app" class="max-w-md mx-auto relative min-h-screen pb-10 bg-[#050505] shadow-2xl shadow-black flex flex-col">

        <!-- Component: Navbar (Placeholder) -->
        <!-- Use the shared <Navbar /> component here -->
        <div class="h-20"></div>

        <main class="px-4 flex-1">
            
            <!-- Search / Filter -->
            <div class="sticky top-0 z-40 bg-[#050505]/95 backdrop-blur-sm pb-4 pt-2 -mx-4 px-4 border-b border-gray-900 mb-6">
                <div class="relative">
                    <i data-lucide="search" class="absolute left-3 top-3 w-4 h-4 text-gray-500"></i>
                    <input type="text" placeholder="Search products..." class="w-full bg-[#1a1a1a] border border-gray-800 rounded-lg py-2.5 pl-9 pr-3 text-sm text-white focus:border-white focus:outline-none transition-colors placeholder-gray-600">
                </div>
                <!-- Filter Chips -->
                <div id="drop-filter-container" class="flex gap-2 mt-3 overflow-x-auto no-scrollbar">
                    <button class="px-3 py-1 bg-white text-black text-[10px] font-bold rounded-full whitespace-nowrap">ALL</button>
                    <!-- Drops will be injected here via JS -->
                    <div id="filter-loader" class="h-6 w-16 bg-gray-800 rounded-full animate-pulse"></div>
                </div>
            </div>

            <!-- Product Grid -->
            <div class="columns-2 gap-3 space-y-3 pb-8">
                
                <!-- Product 1 -->
                <div class="bg-[#e5e5e5] rounded-lg overflow-hidden break-inside-avoid relative group cursor-pointer" onclick="window.location.href='/p/piuma-jacket'">
                    <div class="aspect-[4/5] relative">
                        <img src="https://images.unsplash.com/photo-1551488852-081bd4c9a66d?q=80&w=600&auto=format&fit=crop" class="w-full h-full object-cover mix-blend-multiply">
                    </div>
                    <div class="p-2.5">
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="text-black font-bold text-sm leading-tight">Piuma Jacket</h3>
                            <i data-lucide="arrow-up-right" class="w-3 h-3 text-black"></i>
                        </div>
                        <div class="flex justify-between items-end">
                            <span class="text-[10px] text-gray-600 font-mono">S M L</span>
                            <div class="text-black font-bold text-sm">1650<span class="text-[8px] ml-0.5 align-top">BDT</span></div>
                        </div>
                    </div>
                </div>

                <!-- Product 2 -->
                <div class="bg-[#e5e5e5] rounded-lg overflow-hidden break-inside-avoid relative group cursor-pointer">
                    <div class="aspect-square relative">
                        <img src="https://images.unsplash.com/photo-1576566588028-4147f3842f27?q=80&w=600&auto=format&fit=crop" class="w-full h-full object-cover mix-blend-multiply">
                    </div>
                    <div class="p-2.5">
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="text-black font-bold text-sm leading-tight">Teala Fei</h3>
                            <i data-lucide="arrow-up-right" class="w-3 h-3 text-black"></i>
                        </div>
                        <div class="flex justify-between items-end">
                            <span class="text-[10px] text-gray-600 font-mono">S L</span>
                            <div class="text-black font-bold text-sm">1200<span class="text-[8px] ml-0.5 align-top">BDT</span></div>
                        </div>
                    </div>
                </div>

                <!-- Product 3 -->
                <div class="bg-[#e5e5e5] rounded-lg overflow-hidden break-inside-avoid relative group cursor-pointer">
                    <div class="aspect-[3/4] relative">
                        <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=600&auto=format&fit=crop" class="w-full h-full object-cover mix-blend-multiply">
                    </div>
                    <div class="p-2.5">
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="text-black font-bold text-sm leading-tight">Cargo Heavy</h3>
                            <i data-lucide="arrow-up-right" class="w-3 h-3 text-black"></i>
                        </div>
                        <div class="flex justify-between items-end">
                            <span class="text-[10px] text-gray-600 font-mono">30 32</span>
                            <div class="text-black font-bold text-sm">2200<span class="text-[8px] ml-0.5 align-top">BDT</span></div>
                        </div>
                    </div>
                </div>

                <!-- Product 4 -->
                <div class="bg-[#e5e5e5] rounded-lg overflow-hidden break-inside-avoid relative group cursor-pointer">
                    <div class="aspect-[4/5] relative">
                        <img src="https://images.unsplash.com/photo-1596755094514-f87e34085b2c?q=80&w=600&auto=format&fit=crop" class="w-full h-full object-cover mix-blend-multiply">
                    </div>
                    <div class="p-2.5">
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="text-black font-bold text-sm leading-tight">Spray Marlo</h3>
                            <i data-lucide="arrow-up-right" class="w-3 h-3 text-black"></i>
                        </div>
                        <div class="flex justify-between items-end">
                            <span class="text-[10px] text-gray-600 font-mono">M XL</span>
                            <div class="text-black font-bold text-sm">1200<span class="text-[8px] ml-0.5 align-top">BDT</span></div>
                        </div>
                    </div>
                </div>

            </div>
            
            <div class="text-center py-4 text-xs text-gray-600 font-mono">
                END OF CATALOG
            </div>

        </main>
    </div>
    
    <script>
        lucide.createIcons();

        // Simulate fetching drops from backend
        window.addEventListener('load', () => {
            setTimeout(() => {
                const drops = ['Panter', 'Glitch_Protocol', 'FlowerChild', 'Kaban'];
                const container = document.getElementById('drop-filter-container');
                const loader = document.getElementById('filter-loader');
                
                // Remove loader
                if(loader) loader.remove();

                // Hydrate drops
                drops.forEach(drop => {
                    const btn = document.createElement('button');
                    btn.className = "px-3 py-1 bg-[#1a1a1a] text-gray-400 border border-gray-800 text-[10px] font-bold rounded-full whitespace-nowrap hover:border-gray-500 animate-[fadeIn_0.5s_ease-out]";
                    btn.innerText = drop.toUpperCase();
                    container.appendChild(btn);
                });
            }, 1000); // 1s simulated delay
        });
    </script>
</body>
</html>
